<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" class="css" />
    <link rel="stylesheet" href="style2.css" class="css" />
  </head>
  <body>
    <div class="container">
      <div class="box">
        <span class="bg-animate"></span>
        <span class="bg-animate2"></span>
        <div class="left">
          <h2 class="login animation">Login</h2>
          <div class="inputbox animation">
            <input class="username" type="text" required="required" />
            <label class="label">Username</label>
          </div>
          <div class="inputbox animation">
            <input type="password" class="password" required="required" />
            <label>Password</label>
          </div>
          <button class="lgnbtn animation">Login</button>
          <div class="signupline animation">
            <h5>don't have an account</h5>
            <a class="sgnupbtn" href="#">sign up</a>
          </div>
        </div>
        <div class="right">
          <div class="txt1">Welcome back!</div>
          <div class="lorem">Lorem ipsum dolor sit amet consectetur</div>
        </div>
      </div>
      <div class="registerbox">
        <span class="bg-animate"></span>
        <span class="bg-animate2"></span>
        <div class="left">
          <h2 class="login">Sign up</h2>
          <div class="inputbox">
            <input class="username" type="text" required="required" />
            <label class="label">Username</label>
          </div>
          <div class="inputbox">
            <input class="email" type="email" required="required" />
            <label class="label">Email</label>
          </div>
          <div class="inputbox">
            <input type="password" class="password" required="required" />
            <label>Password</label>
          </div>
          <button class="lgnbtn">Sign up</button>
          <div class="signupline">
            <h5>already have an account</h5>
            <a class="lgnnupbtn" href="#">Login</a>
          </div>
        </div>
        <div class="right">
          <div class="txt1">Welcome back!</div>
          <div class="lorem">Lorem ipsum dolor sit amet consectetur</div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
